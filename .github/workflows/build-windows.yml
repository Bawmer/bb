name: Build Windows x64 VST3

on:
  push:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure (newest MSVC on the runner, x64)
        run: |
          cmake --version
          cmake -S . -B build -A x64 -DHS_BUILD_PROCESSOR_TEST=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Engine + processor tests (render, auto key, capture, preview)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -r "build/BubLeonHarmonyStack_artefacts/Release/VST3/Bub Leon Harmony Stack.vst3" dist/
          cp "build/BubLeonHarmonyStack_artefacts/Release/Standalone/Bub Leon Harmony Stack.exe" dist/
          cp README.md dist/

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: BubLeonHarmonyStack-Windows-x64
          path: dist/

      - name: Validate with pluginval (strictness 10)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pluginval.zip -d pluginval
          mkdir -p pluginval-logs
          set +e
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 300000 \
            --output-dir pluginval-logs "dist/Bub Leon Harmony Stack.vst3" > pluginval-logs/console.txt 2>&1
          code=$?
          set -e
          echo "pluginval exit code: $code"
          tail -n 60 pluginval-logs/console.txt
          if [ $code -ne 0 ]; then
            # surface the failing tests as annotations
            grep -n -E "FAILED|!!!|Exception|Error|failed|Starting test" pluginval-logs/console.txt | grep -B1 -E "FAILED|!!!|Exception|Error|failed" | head -40 | while IFS= read -r line; do
              echo "::error title=pluginval::${line//%/%25}"
            done
            echo "::error title=pluginval-tail::$(tail -n 25 pluginval-logs/console.txt | tr '\r' ' ' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

      - name: Upload pluginval log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-log
          path: pluginval-logs/
          if-no-files-found: ignore
