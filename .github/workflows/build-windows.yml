name: Build Windows x64 VST3

on:
  push:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC, x64)
        run: |
          cmake --version
          cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Rack tests (null, latency, state recall, all modules, factory presets)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -r "build/BubLeonMixRack_artefacts/Release/VST3/Bub Leon Mix Rack.vst3" dist/
          cp "build/BubLeonMixRack_artefacts/Release/Standalone/Bub Leon Mix Rack.exe" dist/
          cp README.md dist/

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: BubLeonMixRack-Windows-x64
          path: dist/

      - name: Validate with pluginval (strictness 8)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pluginval.zip -d pluginval
          mkdir -p pluginval-logs
          set +e
          ./pluginval/pluginval.exe --strictness-level 8 --validate-in-process --timeout-ms 300000 \
            --output-dir pluginval-logs "dist/Bub Leon Mix Rack.vst3" > pluginval-logs/console.txt 2>&1
          code=$?
          set -e
          echo "pluginval exit code: $code"
          tail -n 60 pluginval-logs/console.txt
          if [ $code -ne 0 ]; then
            grep -n -E "FAILED|!!!|Exception|Error|failed" pluginval-logs/console.txt | head -40 | while IFS= read -r line; do
              echo "::error title=pluginval::${line//%/%25}"
            done
            exit 1
          fi

      - name: Upload pluginval log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-log
          path: pluginval-logs/
          if-no-files-found: ignore
